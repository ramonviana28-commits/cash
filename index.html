<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagamento do voto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .choice {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .choice-label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .choice-name {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
    }

    .value-label {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }

    .value {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin: 4px 0 25px;
      color: #111;
    }

    .status {
      padding: 16px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .status.loading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.success {
      background: #ecfdf5;
      color: #047857;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .status.waiting {
      background: #fff7ed;
      color: #c2410c;
    }

    .status-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .payment-area {
      display: none;
      margin-top: 20px;
    }

    .qr-container {
      text-align: center;
      margin: 20px 0;
    }

    #qrcode {
      display: block;
      width: 220px;
      height: 220px;
      margin: 0 auto;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      object-fit: contain;
    }

    .pix-label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .pix-code {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 12px;
      background: #f9fafb;
      word-break: break-all;
    }

    .copy-button {
      width: 100%;
      border: none;
      background: #111;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    .copy-button:hover {
      opacity: 0.9;
    }

    .copy-button:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .checking {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px 10px 40px;
      }

      .card {
        padding: 20px 15px;
      }

      h1 {
        font-size: 23px;
      }

      .value {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">📦</div>

      <h1>Finalize seu voto</h1>

      <div class="subtitle">
        Faça o pagamento de <strong>R$ 5,00</strong> via PIX
        para confirmar sua participação.
      </div>

      <div class="choice">

        <div class="choice-label">
          Sua escolha
        </div>

        <div
          class="choice-name"
          id="choiceName">
          Carregando...
        </div>

      </div>

      <div class="value-label">
        Valor para confirmar o voto
      </div>

      <div class="value">
        R$ 5,00
      </div>

      <div
        id="status"
        class="status loading">

        <div class="status-title">
          Processando...
        </div>

        <div>
          Estamos preparando seu pagamento.
        </div>

      </div>

      <div
        id="paymentArea"
        class="payment-area">

        <div class="qr-container">

          <img
            id="qrcode"
            src=""
            alt="QR Code PIX">

        </div>

        <div class="pix-label">
          PIX copia e cola
        </div>

        <textarea
          id="pixCode"
          class="pix-code"
          readonly></textarea>

        <button
          id="copyButton"
          class="copy-button"
          type="button">

          📋 Copiar PIX

        </button>

        <div
          id="checkingMessage"
          class="checking">

          ⏳ Aguardando confirmação do pagamento...

        </div>

      </div>

    </div>

    <div class="footer">
      Pagamento processado via PIX.
    </div>

  </div>


  <script>

    // ==========================================================
    // CONFIGURAÇÃO
    // ==========================================================

    const PAYMENT_API_URL =
      "https://gyxuyzsovbvbpixggcet.supabase.co/functions/v1/clever-function";

    const PAYMENT_STATUS_API_URL =
      "https://gyxuyzsovbvbpixggcet.supabase.co/functions/v1/rapid-worker";

    const RESULT_URL =
      "https://ramonviana28-commits.github.io/cash/resultados";

    const PAYMENT_VALUE =
      5.00;

    const STATUS_INTERVAL =
      3000;

    const STATUS_TIMEOUT =
      20 * 60 * 1000;


    // ==========================================================
    // CANDIDATOS
    // ==========================================================

    const OPTIONS = {

      "9823e037-4045-40dd-8b5f-a183ea4cdc44":
        "LULA",

      "4debd19b-bf23-4a04-ae44-daa9c05f6fe3":
        "FLÁVIO BOLSONARO",

      "1b457898-2a19-4342-a5f6-2a867b07f27c":
        "RENAN SANTOS"

    };


    // ==========================================================
    // LER PAYMENT_OPTION_ID
    // ==========================================================

    const params =
      new URLSearchParams(
        window.location.search
      );

    const paymentOptionId =
      params.get(
        "payment_option_id"
      );


    // ==========================================================
    // ELEMENTOS
    // ==========================================================

    const choiceName =
      document.getElementById(
        "choiceName"
      );

    const status =
      document.getElementById(
        "status"
      );

    const paymentArea =
      document.getElementById(
        "paymentArea"
      );

    const pixCode =
      document.getElementById(
        "pixCode"
      );

    const qrcode =
      document.getElementById(
        "qrcode"
      );

    const copyButton =
      document.getElementById(
        "copyButton"
      );

    const checkingMessage =
      document.getElementById(
        "checkingMessage"
      );


    // ==========================================================
    // ESTADO
    // ==========================================================

    let currentPaymentId =
      null;

    let statusTimer =
      null;

    let statusStartedAt =
      null;

    let paymentConfirmed =
      false;


    // ==========================================================
    // MOSTRAR STATUS
    // ==========================================================

    function showStatus(
      type,
      title,
      message
    ) {

      status.className =
        "status " + type;

      status.innerHTML = `
        <div class="status-title">
          ${escapeHtml(title)}
        </div>

        <div>
          ${escapeHtml(message)}
        </div>
      `;
    }


    // ==========================================================
    // ESCAPAR HTML
    // ==========================================================

    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ==========================================================
    // IDENTIFICAR CANDIDATO
    // ==========================================================

    function identificarEscolha(
      id
    ) {

      return OPTIONS[id] ||
        null;
    }


    // ==========================================================
    // CRIAR PAGAMENTO
    // ==========================================================

    async function criarPagamento() {

      showStatus(
        "loading",
        "Gerando pagamento...",
        "Aguarde enquanto preparamos seu PIX."
      );

      try {

        const controller =
          new AbortController();

        const timeout =
          setTimeout(
            () =>
              controller.abort(),
            30000
          );


        const response =
          await fetch(
            PAYMENT_API_URL,
            {
              method:
                "POST",

              mode:
                "cors",

              cache:
                "no-store",

              signal:
                controller.signal,

              headers: {
                "Content-Type":
                  "text/plain;charset=UTF-8",

                "Accept":
                  "application/json"
              },

              body:
                JSON.stringify({
                  payment_option_id:
                    paymentOptionId,

                  amount:
                    PAYMENT_VALUE
                })
            }
          );


        clearTimeout(
          timeout
        );


        const responseText =
          await response.text();


        let data;

        try {

          data =
            JSON.parse(
              responseText
            );

        } catch {

          throw new Error(
            "A Edge Function respondeu algo que não é JSON."
          );
        }


        if (!response.ok) {

          throw new Error(
            data?.message ||
            data?.error ||
            "Não foi possível criar o pagamento."
          );
        }


        if (!data.success) {

          throw new Error(
            data?.message ||
            data?.error ||
            "Não foi possível criar o pagamento."
          );
        }


        // ======================================================
        // PAYMENT ID
        // ======================================================

        if (!data.payment_id) {

          throw new Error(
            "O servidor não retornou o payment_id."
          );
        }


        currentPaymentId =
          data.payment_id;


        console.log(
          "PAYMENT ID CRIADO:",
          currentPaymentId
        );


        // ======================================================
        // QR CODE
        // ======================================================

        if (
          data.qr_code
        ) {

          qrcode.src =
            data.qr_code;

          qrcode.style.display =
            "block";

        } else {

          qrcode.style.display =
            "none";
        }


        // ======================================================
        // PIX COPIA E COLA
        // ======================================================

        if (
          data.pix_code
        ) {

          pixCode.value =
            data.pix_code;

        } else {

          pixCode.value =
            "Código PIX não retornado.";
        }


        // ======================================================
        // MOSTRAR ÁREA
        // ======================================================

        paymentArea.style.display =
          "block";


        showStatus(
          "waiting",
          "PIX gerado!",
          "Realize o pagamento. A confirmação será detectada automaticamente."
        );


        checkingMessage.textContent =
          "⏳ Aguardando confirmação do pagamento...";


        console.log(
          "Pagamento criado:",
          data
        );


        // ======================================================
        // COMEÇAR MONITORAMENTO
        // ======================================================

        iniciarMonitoramentoPagamento();


      } catch (error) {

        console.error(
          "Erro ao criar pagamento:",
          error
        );


        let message =
          "Não foi possível conectar ao servidor de pagamento.";


        if (
          error &&
          error.name ===
            "AbortError"
        ) {

          message =
            "A conexão demorou mais de 30 segundos e foi encerrada.";

        } else if (
          error &&
          error.message
        ) {

          message =
            error.message;
        }


        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          message
        );
      }
    }


    // ==========================================================
    // INICIAR MONITORAMENTO
    // ==========================================================

    function iniciarMonitoramentoPagamento() {

      if (
        !currentPaymentId
      ) {
        return;
      }


      if (
        statusTimer
      ) {

        clearInterval(
          statusTimer
        );
      }


      statusStartedAt =
        Date.now();


      // Consulta imediatamente
      verificarStatusPagamento();


      // Depois consulta a cada 3 segundos
      statusTimer =
        setInterval(
          verificarStatusPagamento,
          STATUS_INTERVAL
        );
    }


    // ==========================================================
    // CONSULTAR STATUS
    // ==========================================================

    async function verificarStatusPagamento() {

      if (
        !currentPaymentId ||
        paymentConfirmed
      ) {
        return;
      }


      // ========================================================
      // TIMEOUT
      // ========================================================

      if (
        statusStartedAt &&
        Date.now() -
          statusStartedAt >
          STATUS_TIMEOUT
      ) {

        if (
          statusTimer
        ) {

          clearInterval(
            statusTimer
          );

          statusTimer =
            null;
        }


        checkingMessage.textContent =
          "A confirmação automática foi pausada. Se você já pagou, atualize a página.";

        return;
      }


      try {

        console.log(
          "Consultando status:",
          currentPaymentId
        );


        // ======================================================
        // RAPID-WORKER USA POST
        // ======================================================

        const response =
          await fetch(
            PAYMENT_STATUS_API_URL,
            {
              method:
                "POST",

              mode:
                "cors",

              cache:
                "no-store",

              headers: {
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body:
                JSON.stringify({
                  payment_id:
                    currentPaymentId
                })
            }
          );


        const responseText =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(
              responseText
            );

        } catch {

          console.warn(
            "Resposta não JSON da rapid-worker:",
            responseText
          );

          return;
        }


        console.log(
          "RESPOSTA RAPID-WORKER:",
          data
        );


        // ======================================================
        // AINDA NÃO ENCONTRADO
        // ======================================================

        if (
          response.status ===
            404
        ) {

          checkingMessage.textContent =
            "⏳ Aguardando registro do pagamento...";

          return;
        }


        // ======================================================
        // ERRO TEMPORÁRIO
        // ======================================================

        if (
          !response.ok
        ) {

          console.warn(
            "Erro ao consultar status:",
            response.status,
            data
          );

          return;
        }


        if (
          !data.success
        ) {

          console.warn(
            "Consulta de status sem sucesso:",
            data
          );

          return;
        }


        // ======================================================
        // STATUS
        // ======================================================

        const currentStatus =
          String(
            data.status ||
            ""
          ).toUpperCase();


        console.log(
          "STATUS ATUAL:",
          currentStatus
        );


        // ======================================================
        // CONFIRMADO
        // ======================================================

        if (
          data.paid ===
            true ||
          currentStatus ===
            "RECEIVED" ||
          currentStatus ===
            "CONFIRMED"
        ) {

          confirmarPagamento();

          return;
        }


        // ======================================================
        // PENDENTE
        // ======================================================

        if (
          currentStatus ===
            "PENDING"
        ) {

          checkingMessage.textContent =
            "⏳ Aguardando confirmação do PIX...";

          return;
        }


        // ======================================================
        // OUTRO STATUS
        // ======================================================

        checkingMessage.textContent =
          "⏳ Status do pagamento: " +
          currentStatus;


      } catch (error) {

        console.warn(
          "Falha temporária ao consultar status:",
          error
        );
      }
    }


    // ==========================================================
    // PAGAMENTO CONFIRMADO
    // ==========================================================

    function confirmarPagamento() {

      if (
        paymentConfirmed
      ) {
        return;
      }


      paymentConfirmed =
        true;


      if (
        statusTimer
      ) {

        clearInterval(
          statusTimer
        );

        statusTimer =
          null;
      }


      checkingMessage.textContent =
        "✅ Pagamento confirmado!";


      showStatus(
        "success",
        "Pagamento confirmado! ✅",
        "Seu voto foi confirmado. Você será direcionado para o resultado da votação."
      );


      copyButton.disabled =
        true;


      copyButton.textContent =
        "✅ Pagamento confirmado";


      setTimeout(
        () => {

          window.location.href =
            RESULT_URL;

        },
        2000
      );
    }


    // ==========================================================
    // COPIAR PIX
    // ==========================================================

    async function copiarPix() {

      const codigo =
        pixCode.value.trim();


      if (
        !codigo
      ) {

        alert(
          "O código PIX ainda não está disponível."
        );

        return;
      }


      try {

        await navigator.clipboard.writeText(
          codigo
        );


        copyButton.textContent =
          "✅ PIX copiado!";


        setTimeout(
          () => {

            if (
              !paymentConfirmed
            ) {

              copyButton.textContent =
                "📋 Copiar PIX";
            }

          },
          2000
        );


      } catch {

        pixCode.focus();

        pixCode.select();

        document.execCommand(
          "copy"
        );


        alert(
          "PIX copiado!"
        );
      }
    }


    // ==========================================================
    // BOTÃO
    // ==========================================================

    copyButton.addEventListener(
      "click",
      copiarPix
    );


    // ==========================================================
    // INICIAR
    // ==========================================================

    async function iniciar() {

      if (
        !paymentOptionId
      ) {

        choiceName.textContent =
          "Nenhuma escolha foi informada";


        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "Nenhuma opção de voto foi informada."
        );

        return;
      }


      const nome =
        identificarEscolha(
          paymentOptionId
        );


      if (
        !nome
      ) {

        choiceName.textContent =
          "Opção desconhecida";


        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "O identificador da opção de voto não está cadastrado."
        );

        return;
      }


      choiceName.textContent =
        nome;


      await criarPagamento();
    }


    // ==========================================================
    // EXECUTAR
    // ==========================================================

    iniciar();

  </script>

</body>
</html>
