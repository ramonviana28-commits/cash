<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagamento do voto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .choice {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .choice-label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .choice-name {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
    }

    .value-label {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }

    .value {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin: 4px 0 25px;
      color: #111;
    }

    .status {
      padding: 16px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .status.loading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.success {
      background: #ecfdf5;
      color: #047857;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .status-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .payment-area {
      display: none;
      margin-top: 20px;
    }

    .qr-container {
      text-align: center;
      margin: 20px 0;
    }

    #qrcode {
      display: block;
      width: 220px;
      height: 220px;
      margin: 0 auto;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      object-fit: contain;
    }

    .pix-label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .pix-code {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 12px;
      background: #f9fafb;
      word-break: break-all;
    }

    .copy-button {
      width: 100%;
      border: none;
      background: #111;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    .copy-button:hover {
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
    }

    .debug {
      margin-top: 20px;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px 10px 40px;
      }

      .card {
        padding: 20px 15px;
      }

      h1 {
        font-size: 23px;
      }

      .value {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">📦</div>

      <h1>Finalize seu voto</h1>

      <div class="subtitle">
        Faça o pagamento de <strong>R$ 5,00</strong> via PIX
        para confirmar sua participação.
      </div>

      <div class="choice">

        <div class="choice-label">
          Sua escolha
        </div>

        <div
          class="choice-name"
          id="choiceName">
          Carregando...
        </div>

      </div>

      <div class="value-label">
        Valor para confirmar o voto
      </div>

      <div class="value">
        R$ 5,00
      </div>

      <div
        id="status"
        class="status loading">

        <div class="status-title">
          Processando...
        </div>

        <div id="statusMessage">
          Estamos preparando seu pagamento.
        </div>

      </div>

      <div
        id="paymentArea"
        class="payment-area">

        <div class="qr-container">

          <img
            id="qrcode"
            src=""
            alt="QR Code PIX">

        </div>

        <div class="pix-label">
          PIX copia e cola
        </div>

        <textarea
          id="pixCode"
          class="pix-code"
          readonly></textarea>

        <button
          type="button"
          class="copy-button"
          onclick="copiarPix()">

          📋 Copiar PIX

        </button>

      </div>

      <div
        id="debug"
        class="debug">
      </div>

    </div>

    <div class="footer">
      Pagamento processado via PIX.
    </div>

  </div>


  <script>

    /*
     * ==========================================================
     * CONFIGURAÇÃO DA API
     * ==========================================================
     *
     * ATENÇÃO:
     *
     * Esta URL será preenchida quando a Edge Function
     * do Supabase estiver criada.
     *
     * NÃO coloque a chave secreta do Asaas neste arquivo.
     */

    const PAYMENT_API_URL = "";


    /*
     * ==========================================================
     * VALOR DO VOTO
     * ==========================================================
     */

    const PAYMENT_VALUE = 5.00;


    /*
     * ==========================================================
     * CANDIDATOS
     * ==========================================================
     *
     * Os IDs abaixo são exatamente os IDs enviados pelo Tally.
     */

    const CANDIDATOS = {

      "9823e037-4045-40dd-8b5f-a183ea4cdc44": {
        nome: "LULA"
      },

      "1b457898-2a19-4342-a5f6-2a867b07f27c": {
        nome: "FLÁVIO BOLSONARO"
      },

      "4debd19b-bf23-4a04-ae44-daa9c05f6fe3": {
        nome: "RENAN SANTOS"
      }

    };


    /*
     * ==========================================================
     * LER PARÂMETROS DA URL
     * ==========================================================
     *
     * Exemplo:
     *
     * pagamento.html?payment_option_id=9823e037-4045-40dd-8b5f-a183ea4cdc44
     */

    const params =
      new URLSearchParams(window.location.search);

    const paymentOptionId =
      params.get("payment_option_id");


    /*
     * ==========================================================
     * ELEMENTOS DA PÁGINA
     * ==========================================================
     */

    const choiceName =
      document.getElementById("choiceName");

    const status =
      document.getElementById("status");

    const statusMessage =
      document.getElementById("statusMessage");

    const paymentArea =
      document.getElementById("paymentArea");

    const pixCode =
      document.getElementById("pixCode");

    const qrcode =
      document.getElementById("qrcode");

    const debug =
      document.getElementById("debug");


    /*
     * ==========================================================
     * MOSTRAR STATUS
     * ==========================================================
     */

    function showStatus(type, title, message) {

      status.className =
        "status " + type;

      status.innerHTML = `
        <div class="status-title">
          ${title}
        </div>

        <div>
          ${message}
        </div>
      `;

    }


    /*
     * ==========================================================
     * IDENTIFICAR CANDIDATO
     * ==========================================================
     */

    function identificarEscolha(id) {

      if (!id) {

        return null;

      }

      return CANDIDATOS[id] || null;

    }


    /*
     * ==========================================================
     * INICIALIZAÇÃO
     * ==========================================================
     */

    function iniciar() {

      /*
       * Não recebeu payment_option_id.
       */

      if (!paymentOptionId) {

        choiceName.textContent =
          "Nenhuma escolha foi informada";

        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "Nenhuma opção de voto foi informada."
        );

        debug.innerHTML =
          "<strong>Erro:</strong><br>" +
          "A URL não contém o parâmetro payment_option_id.";

        return;

      }


      /*
       * Procura o candidato pelo ID.
       */

      const candidato =
        identificarEscolha(paymentOptionId);


      /*
       * ID não cadastrado.
       */

      if (!candidato) {

        choiceName.textContent =
          "Opção desconhecida";

        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "O identificador da opção de voto não corresponde a nenhuma opção cadastrada."
        );

        debug.innerHTML =
          "<strong>payment_option_id recebido:</strong><br>" +
          paymentOptionId;

        return;

      }


      /*
       * Candidato encontrado.
       */

      choiceName.textContent =
        candidato.nome;


      /*
       * Diagnóstico temporário.
       */

      debug.innerHTML =
        "<strong>payment_option_id recebido:</strong><br>" +
        paymentOptionId;


      /*
       * Se a API ainda não estiver configurada,
       * apenas confirma que a escolha foi recebida.
       */

      if (!PAYMENT_API_URL) {

        showStatus(
          "success",
          "Escolha recebida corretamente!",
          "O sistema recebeu o identificador da sua escolha. A próxima etapa será gerar o PIX."
        );

        return;

      }


      /*
       * API configurada.
       */

      criarPagamento();

    }


    /*
     * ==========================================================
     * CRIAR PAGAMENTO
     * ==========================================================
     *
     * O navegador envia apenas o ID da opção.
     *
     * O backend será responsável por:
     *
     * 1. Validar o candidato
     * 2. Criar o cliente/pagamento no Asaas
     * 3. Gerar o PIX
     * 4. Retornar o QR Code
     * 5. Retornar o PIX copia e cola
     *
     */

    async function criarPagamento() {

      showStatus(
        "loading",
        "Gerando pagamento...",
        "Aguarde enquanto preparamos seu PIX."
      );


      try {

        const response =
          await fetch(
            PAYMENT_API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                payment_option_id:
                  paymentOptionId,

                amount:
                  PAYMENT_VALUE

              })

            }
          );


        /*
         * Tenta interpretar a resposta como JSON.
         */

        let data;

        try {

          data =
            await response.json();

        } catch (jsonError) {

          throw new Error(
            "O servidor retornou uma resposta inválida."
          );

        }


        /*
         * Erro HTTP.
         */

        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Erro ao criar pagamento."
          );

        }


        /*
         * Backend informou erro.
         */

        if (data.success === false) {

          throw new Error(
            data.message ||
            data.error ||
            "Não foi possível gerar o PIX."
          );

        }


        /*
         * QR Code.
         */

        if (data.qr_code) {

          qrcode.src =
            data.qr_code;

        }


        /*
         * PIX copia e cola.
         */

        if (data.pix_code) {

          pixCode.value =
            data.pix_code;

        }


        /*
         * Verifica se recebeu pelo menos
         * um dos dados necessários.
         */

        if (
          !data.qr_code &&
          !data.pix_code
        ) {

          throw new Error(
            "O pagamento foi criado, mas o servidor não retornou os dados do PIX."
          );

        }


        /*
         * Exibe área do pagamento.
         */

        paymentArea.style.display =
          "block";


        /*
         * Remove diagnóstico quando
         * o pagamento estiver funcionando.
         */

        showStatus(
          "success",
          "PIX gerado!",
          "Escaneie o QR Code ou copie o código PIX para realizar o pagamento."
        );


      } catch (error) {

        console.error(
          "Erro ao criar pagamento:",
          error
        );


        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          error.message ||
          "Ocorreu um erro ao preparar o PIX."
        );

      }

    }


    /*
     * ==========================================================
     * COPIAR PIX
     * ==========================================================
     */

    async function copiarPix() {

      const codigo =
        pixCode.value.trim();


      if (!codigo) {

        alert(
          "O código PIX ainda não está disponível."
        );

        return;

      }


      /*
       * Método moderno.
       */

      try {

        await navigator.clipboard.writeText(
          codigo
        );

        alert(
          "PIX copiado com sucesso!"
        );

        return;

      } catch (error) {

        /*
         * Continua para o método alternativo.
         */

      }


      /*
       * Método alternativo para navegadores
       * que não permitem navigator.clipboard.
       */

      try {

        pixCode.focus();

        pixCode.select();

        document.execCommand(
          "copy"
        );

        alert(
          "PIX copiado!"
        );

      } catch (error) {

        alert(
          "Não foi possível copiar automaticamente. Selecione o código PIX e copie manualmente."
        );

      }

    }


    /*
     * ==========================================================
     * INICIAR
     * ==========================================================
     */

    iniciar();

  </script>

</body>
</html>
