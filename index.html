<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pagamento do voto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 25px 15px 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .choice {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .choice-label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .choice-name {
      font-size: 20px;
      font-weight: bold;
      color: #111827;
    }

    .value-label {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }

    .value {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin: 4px 0 25px;
      color: #111;
    }

    .status {
      padding: 16px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .status.loading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .status.success {
      background: #ecfdf5;
      color: #047857;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .status-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .payment-area {
      display: none;
      margin-top: 20px;
    }

    .qr-container {
      text-align: center;
      margin: 20px 0;
    }

    #qrcode {
      display: block;
      width: 220px;
      height: 220px;
      margin: 0 auto;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .pix-label {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .pix-code {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 12px;
      background: #f9fafb;
      word-break: break-all;
    }

    .copy-button {
      width: 100%;
      border: none;
      background: #111;
      color: #fff;
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
    }

    .copy-button:hover {
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 20px;
    }

    .debug {
      display: none;
      margin-top: 20px;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 11px;
      color: #64748b;
      word-break: break-all;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px 10px 40px;
      }

      .card {
        padding: 20px 15px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="logo">📦</div>

      <h1>Finalize seu voto</h1>

      <div class="subtitle">
        Faça o pagamento de <strong>R$ 5,00</strong> via PIX
        para confirmar sua participação.
      </div>

      <div class="choice">

        <div class="choice-label">
          Sua escolha
        </div>

        <div
          class="choice-name"
          id="choiceName">
          Carregando...
        </div>

      </div>

      <div class="value-label">
        Valor para confirmar o voto
      </div>

      <div class="value">
        R$ 5,00
      </div>

      <div
        id="status"
        class="status loading">

        <div class="status-title">
          Processando...
        </div>

        <div id="statusMessage">
          Estamos preparando seu pagamento.
        </div>

      </div>

      <div
        id="paymentArea"
        class="payment-area">

        <div class="qr-container">

          <img
            id="qrcode"
            src=""
            alt="QR Code PIX">

        </div>

        <div class="pix-label">
          PIX copia e cola
        </div>

        <textarea
          id="pixCode"
          class="pix-code"
          readonly></textarea>

        <button
          id="copyButton"
          class="copy-button"
          type="button">

          📋 Copiar PIX

        </button>

      </div>

      <div
        id="debug"
        class="debug">
      </div>

    </div>

    <div class="footer">
      Pagamento processado via PIX.
    </div>

  </div>


  <script>

    /*
     * ==========================================================
     * CONFIGURAÇÃO
     * ==========================================================
     *
     * Esta é a Edge Function que cria a cobrança no Asaas.
     */

    const PAYMENT_API_URL =
      "https://gyxuyzsovbvbpixggcet.supabase.co/functions/v1/smooth-function";


    /*
     * Valor fixo do voto.
     *
     * O backend também deve manter R$ 5,00 como valor oficial.
     */

    const PAYMENT_VALUE = 5.00;


    /*
     * ==========================================================
     * OPÇÕES DA PESQUISA
     * ==========================================================
     */

    const OPTIONS = {

      "9823e037-4045-40dd-8b5f-a183ea4cdc44":
        "LULA",

      "4debd19b-bf23-4a04-ae44-daa9c05f6fe3":
        "FLÁVIO BOLSONARO",

      "1b457898-2a19-4342-a5f6-2a867b07f27c":
        "RENAN SANTOS"

    };


    /*
     * ==========================================================
     * LER PAYMENT_OPTION_ID
     * ==========================================================
     */

    const params =
      new URLSearchParams(window.location.search);

    const paymentOptionId =
      params.get("payment_option_id");


    /*
     * ==========================================================
     * ELEMENTOS
     * ==========================================================
     */

    const choiceName =
      document.getElementById("choiceName");

    const status =
      document.getElementById("status");

    const statusMessage =
      document.getElementById("statusMessage");

    const paymentArea =
      document.getElementById("paymentArea");

    const pixCode =
      document.getElementById("pixCode");

    const qrcode =
      document.getElementById("qrcode");

    const debug =
      document.getElementById("debug");

    const copyButton =
      document.getElementById("copyButton");


    /*
     * ==========================================================
     * MOSTRAR STATUS
     * ==========================================================
     */

    function showStatus(
      type,
      title,
      message
    ) {

      status.className =
        "status " + type;

      status.innerHTML = `
        <div class="status-title">
          ${escapeHtml(title)}
        </div>

        <div>
          ${escapeHtml(message)}
        </div>
      `;
    }


    /*
     * ==========================================================
     * ESCAPAR TEXTO
     * ==========================================================
     */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * ==========================================================
     * IDENTIFICAR CANDIDATO
     * ==========================================================
     */

    function identificarEscolha(id) {

      return OPTIONS[id] || null;

    }


    /*
     * ==========================================================
     * CRIAR PAGAMENTO
     * ==========================================================
     */

    async function criarPagamento() {

      showStatus(
        "loading",
        "Gerando pagamento...",
        "Aguarde enquanto preparamos seu PIX."
      );


      try {

        /*
         * Timeout de 30 segundos.
         */

        const controller =
          new AbortController();

        const timeout =
          setTimeout(
            () => controller.abort(),
            30000
          );


        /*
         * IMPORTANTE:
         *
         * Usamos text/plain para evitar
         * preflight CORS desnecessário.
         *
         * A Edge Function continua usando:
         *
         * await req.json()
         */

        const response =
          await fetch(
            PAYMENT_API_URL,
            {
              method: "POST",

              mode: "cors",

              cache: "no-store",

              signal:
                controller.signal,

              headers: {
                "Content-Type":
                  "text/plain;charset=UTF-8",

                "Accept":
                  "application/json"
              },

              body: JSON.stringify({

                payment_option_id:
                  paymentOptionId,

                amount:
                  PAYMENT_VALUE

              })
            }
          );


        clearTimeout(timeout);


        /*
         * Tenta interpretar a resposta como JSON.
         */

        const responseText =
          await response.text();


        let data;

        try {

          data =
            JSON.parse(responseText);

        } catch {

          throw new Error(
            "A Edge Function respondeu algo que não é JSON."
          );

        }


        /*
         * ======================================================
         * ERRO HTTP
         * ======================================================
         */

        if (!response.ok) {

          throw new Error(
            data?.message ||
            `Erro HTTP ${response.status}.`
          );

        }


        /*
         * ======================================================
         * VERIFICAR SUCESSO
         * ======================================================
         */

        if (!data.success) {

          throw new Error(
            data?.message ||
            "A Edge Function não conseguiu criar o pagamento."
          );

        }


        /*
         * ======================================================
         * QR CODE
         * ======================================================
         */

        if (data.qr_code) {

          qrcode.src =
            data.qr_code;

          qrcode.style.display =
            "block";

        } else {

          qrcode.style.display =
            "none";

        }


        /*
         * ======================================================
         * PIX COPIA E COLA
         * ======================================================
         */

        if (data.pix_code) {

          pixCode.value =
            data.pix_code;

        } else {

          pixCode.value =
            "Código PIX não retornado.";

        }


        /*
         * Mostrar área de pagamento.
         */

        paymentArea.style.display =
          "block";


        /*
         * Mensagem de sucesso.
         */

        showStatus(
          "success",
          "PIX gerado com sucesso!",
          "Escaneie o QR Code ou copie o código PIX para realizar o pagamento."
        );


        /*
         * Debug temporário no console.
         */

        console.log(
          "Pagamento criado:",
          data
        );

      } catch (error) {

        console.error(
          "Erro ao chamar smooth-function:",
          error
        );


        let message =
          "Não foi possível conectar ao servidor de pagamento.";


        if (
          error &&
          error.name === "AbortError"
        ) {

          message =
            "A conexão demorou mais de 30 segundos e foi encerrada.";

        } else if (
          error &&
          error.message
        ) {

          message =
            error.message;

        }


        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          message
        );

      }

    }


    /*
     * ==========================================================
     * COPIAR PIX
     * ==========================================================
     */

    async function copiarPix() {

      const codigo =
        pixCode.value.trim();


      if (!codigo) {

        alert(
          "O código PIX ainda não está disponível."
        );

        return;

      }


      try {

        await navigator.clipboard.writeText(
          codigo
        );

        copyButton.textContent =
          "✅ PIX copiado!";


        setTimeout(
          () => {

            copyButton.textContent =
              "📋 Copiar PIX";

          },
          2000
        );


      } catch {

        pixCode.focus();

        pixCode.select();

        document.execCommand("copy");

        alert(
          "PIX copiado!"
        );

      }

    }


    /*
     * ==========================================================
     * EVENTO DO BOTÃO
     * ==========================================================
     */

    copyButton.addEventListener(
      "click",
      copiarPix
    );


    /*
     * ==========================================================
     * INICIAR
     * ==========================================================
     */

    async function iniciar() {

      /*
       * Verifica se recebeu o ID.
       */

      if (!paymentOptionId) {

        choiceName.textContent =
          "Nenhuma escolha foi informada";

        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "Nenhuma opção de voto foi informada."
        );

        return;

      }


      /*
       * Identifica o candidato.
       */

      const nome =
        identificarEscolha(
          paymentOptionId
        );


      if (!nome) {

        choiceName.textContent =
          "Opção desconhecida";

        showStatus(
          "error",
          "Não foi possível gerar o pagamento.",
          "O identificador da opção de voto não está cadastrado."
        );

        return;

      }


      /*
       * Mostra candidato.
       */

      choiceName.textContent =
        nome;


      /*
       * Agora chama a Edge Function.
       */

      await criarPagamento();

    }


    /*
     * ==========================================================
     * EXECUTAR
     * ==========================================================
     */

    iniciar();

  </script>

</body>
</html>
